<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WolfOS 🐺</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐺</text></svg>">
<style>
:root{--acc:#7b5cff;--glass:rgba(255,255,255,.72);--txt:#1d1b26;--muted:#6b6880;--win:#ffffff;--bar:rgba(246,245,250,.92);--line:rgba(0,0,0,.08)}
body.dark{--glass:rgba(30,28,40,.72);--txt:#f2f0fa;--muted:#a19db8;--win:#1f1d2a;--bar:rgba(40,37,54,.95);--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--txt);-webkit-user-select:none;user-select:none}
input,textarea,button{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#wall{position:fixed;inset:0;background:var(--wall,linear-gradient(135deg,#6a5cff,#ff6fb5 55%,#ffb86b));background-size:cover;transition:background .5s}
/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(0,0,0,.15)}
.lcard{width:min(380px,92vw);text-align:center;color:#fff}
.lcard .ava{font-size:72px;width:120px;height:120px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.25);box-shadow:0 10px 40px rgba(0,0,0,.2)}
.lcard h1{margin:6px 0 2px;font-size:30px;letter-spacing:.5px}
.lcard p{margin:0 0 16px;opacity:.85}
.lin{width:100%;padding:12px 16px;border-radius:14px;border:none;background:rgba(255,255,255,.3);color:#fff;font-size:17px;outline:none;text-align:center;margin:6px 0}
.lin::placeholder{color:rgba(255,255,255,.75)}
.emo{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0 12px}
.emo button{font-size:24px;border:none;background:rgba(255,255,255,.18);border-radius:12px;width:42px;height:42px}
.emo button.on{background:#fff;transform:scale(1.1)}
.lbtn{width:100%;padding:12px;border:none;border-radius:14px;font-size:17px;font-weight:700;background:#fff;color:#4b36d6;margin-top:8px}
.lrow{display:flex;gap:8px}
.lrow .lin{flex:1}
.lrow .lbtn{width:auto;padding:12px 18px}
/* ---------- menubar ---------- */
#menubar{position:fixed;top:0;left:0;right:0;height:30px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:14px;z-index:30}
#menubar b{font-weight:700}
#menubar .sp{flex:1}
.mchip{padding:2px 8px;border-radius:7px}
.mchip:hover{background:rgba(127,127,127,.18)}
#wolfMenu{position:fixed;top:32px;left:8px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:10px;padding:6px;z-index:40;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px}
#wolfMenu div{padding:6px 10px;border-radius:6px}
#wolfMenu div:hover{background:var(--acc);color:#fff}
#wolfMenu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
/* ---------- dock ---------- */
#dock{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:6px;padding:6px 8px;border-radius:20px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:98vw;overflow-x:auto}
.dk{position:relative;width:52px;height:52px;border-radius:13px;border:none;font-size:30px;display:flex;align-items:center;justify-content:center;transition:transform .15s,margin .15s;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.dk:hover{transform:translateY(-10px) scale(1.25);margin:0 8px}
.dk .tip{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);background:var(--glass);padding:3px 9px;border-radius:7px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;color:var(--txt)}
.dk:hover .tip{opacity:1}
.dk.open::after{content:"";position:absolute;bottom:-5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--txt)}
.dk .badge{position:absolute;top:-4px;right:-4px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sep{width:1px;height:44px;background:var(--line);margin:0 2px}
/* ---------- windows ---------- */
#desk{position:fixed;top:30px;left:0;right:0;bottom:0}
.win{position:absolute;background:var(--win);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 0 1px var(--line);display:flex;flex-direction:column;overflow:hidden;min-width:260px;min-height:180px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.win.closing{animation:shut .15s ease-in forwards}
@keyframes shut{to{transform:scale(.85);opacity:0}}
.tbar{height:36px;display:flex;align-items:center;padding:0 12px;gap:8px;background:var(--bar);border-bottom:1px solid var(--line);cursor:grab;flex:0 0 auto}
.lights{display:flex;gap:8px}
.lights i{width:13px;height:13px;border-radius:50%;display:block;cursor:pointer}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.win:not(.focus) .lights i{background:#c9c7d1}
.tbar .tt{flex:1;text-align:center;font-weight:600;font-size:14px;margin-right:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbody{flex:1;overflow:auto;position:relative;user-select:text;-webkit-user-select:text}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 80px)!important;border-radius:0}
/* ---------- cursors ---------- */
#curs{position:fixed;inset:0;pointer-events:none;z-index:45}
.rc{position:absolute;transition:left .09s linear,top .09s linear;font-size:24px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.rc span{position:absolute;left:24px;top:22px;font-size:11px;font-weight:700;color:#fff;padding:2px 7px;border-radius:8px;white-space:nowrap}
/* ---------- notif ---------- */
#notifs{position:fixed;top:38px;right:10px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(330px,90vw)}
.nt{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;animation:slide .25s ease-out;font-size:14px}
@keyframes slide{from{transform:translateX(120%)}}
.nt .ic{font-size:26px}
.nt b{display:block;font-size:13px}
/* ---------- apps ---------- */
.pad{padding:12px}
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:7px 11px;border-radius:16px;background:rgba(127,127,127,.15);align-self:flex-start;word-wrap:break-word}
.msg.me{background:var(--acc);color:#fff;align-self:flex-end}
.msg small{display:block;font-size:11px;opacity:.7;font-weight:600}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px}
.cin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.cin input{flex:1;border:1px solid var(--line);background:rgba(127,127,127,.08);border-radius:18px;padding:8px 12px;outline:none}
.qe{display:flex;gap:4px;padding:4px 8px 0;flex-wrap:wrap}
.qe button{border:none;background:none;font-size:20px;padding:2px}
.btn{border:none;background:var(--acc);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600}
.btn.g{background:rgba(127,127,127,.18);color:var(--txt)}
/* tic tac */
.ttt{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;background:var(--line);padding:2px;border-radius:8px;aspect-ratio:1;max-width:100%}
.ttt div{background:var(--win);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(10px,2.3vw,20px);cursor:pointer;aspect-ratio:1}
.ttt div.X{color:#ff3b6b}.ttt div.O{color:#2f80ff}
.ttt div.w{background:#ffe9a8}
.tinfo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-weight:600}
/* piano */
.piano{display:flex;position:relative;height:180px;margin-top:10px;user-select:none}
.wk{flex:1;background:#fff;border:1px solid #bbb;border-radius:0 0 8px 8px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11px;color:#999;transition:background .1s}
.bk{position:absolute;width:6%;height:60%;background:#222;border-radius:0 0 6px 6px;z-index:2;transition:background .1s}
.wk.hit,.bk.hit{background:var(--hc,#7b5cff)!important}
.plog{font-size:13px;color:var(--muted);min-height:20px}
/* notes */
.board{position:relative;width:100%;height:100%;min-height:300px;background:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px)}
.stk{position:absolute;width:160px;min-height:140px;padding:8px;border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,.2);display:flex;flex-direction:column;color:#2b2140}
.stk .sh{display:flex;justify-content:space-between;font-size:11px;font-weight:700;cursor:grab;opacity:.7;margin-bottom:4px}
.stk textarea{flex:1;border:none;background:transparent;resize:none;outline:none;font-size:15px;min-height:100px;font-family:"Marker Felt","Comic Sans MS",cursive;color:#2b2140}
/* terminal */
.term{background:#14121c;color:#9dff9d;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;height:100%;padding:10px;overflow:auto;white-space:pre-wrap}
.term input{background:none;border:none;outline:none;color:#9dff9d;font-family:inherit;font-size:inherit;width:70%}
/* weather */
.wx{text-align:center;padding:16px;background:linear-gradient(180deg,#4facfe,#00c6fb);color:#fff;height:100%}
.wx .big{font-size:64px;font-weight:200;margin:4px 0}
.wx .days{display:flex;justify-content:space-around;margin-top:16px;background:rgba(255,255,255,.2);border-radius:14px;padding:10px}
/* calc */
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:#1c1c1e;height:100%}
.calc .scr{grid-column:1/-1;color:#fff;font-size:40px;text-align:right;padding:10px 6px;font-weight:300;overflow:hidden}
.calc button{border:none;border-radius:50%;aspect-ratio:1;font-size:22px;background:#333;color:#fff}
.calc button.o{background:#ff9f0a}.calc button.f{background:#a5a5a5;color:#000}
.calc button.z{grid-column:span 2;aspect-ratio:auto;border-radius:40px}
/* settings */
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.walls button{height:60px;border-radius:10px;border:3px solid transparent}
.walls button.on{border-color:var(--acc)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ppl{display:flex;flex-direction:column;gap:6px}
.ppl div{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:rgba(127,127,127,.1)}
/* desktop icons */
#icons{position:absolute;top:10px;right:10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);gap:4px;height:calc(100% - 110px);direction:rtl;z-index:1}
.dico{direction:ltr;width:84px;height:88px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:8px;cursor:default;border:2px solid transparent}
.dico .ii{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.dico span{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);text-align:center;line-height:1.15;padding:1px 4px;border-radius:4px}
.dico.sel{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35)}
.dico.sel span{background:var(--acc);text-shadow:none}
/* context menu */
#ctx{position:fixed;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:10px;padding:5px;z-index:70;min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14px}
#ctx div{padding:6px 10px;border-radius:6px;cursor:default}
#ctx div:hover{background:var(--acc);color:#fff}
#ctx hr{border:none;border-top:1px solid var(--line);margin:4px 0}
/* spotlight */
#spot{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-start;padding-top:16vh;background:rgba(0,0,0,.12)}
#spot .sbx{width:min(600px,94vw);background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden;animation:pop .15s ease-out}
#spot .sin{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:22px}
#spot input{flex:1;border:none;background:none;outline:none;font-size:22px}
#spot .sres{max-height:50vh;overflow:auto;border-top:1px solid var(--line)}
#spot .sres:empty{display:none}
#spot .sr{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;font-size:15px}
#spot .sr .ii{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
#spot .sr small{margin-left:auto;color:var(--muted);font-size:12px}
#spot .sr.on{background:var(--acc);color:#fff}
#spot .sr.on small{color:rgba(255,255,255,.8)}
@media (max-width:700px){#icons{top:6px;right:4px;grid-template-rows:repeat(auto-fill,84px)}.dico{width:72px;height:82px}.dico .ii{width:48px;height:48px;font-size:26px}#spot{padding-top:8vh}
.dk{width:44px;height:44px;font-size:24px}.dk:hover{transform:none;margin:0}#menubar .hm{display:none}}
</style>
</head>
<body>
<div id="wall"></div>

<div id="login">
 <div class="lcard">
  <div class="ava" id="lAva">🐺</div>
  <h1>WolfOS</h1>
  <p>Plocha pro tebe a kámoše 💻</p>
  <input class="lin" id="lName" maxlength="16" placeholder="Tvoje jméno">
  <div class="emo" id="lEmo"></div>
  <button class="lbtn" id="lNew">➕ Nová plocha</button>
  <div class="lrow"><input class="lin" id="lCode" maxlength="5" placeholder="KÓD plochy" style="text-transform:uppercase"><button class="lbtn" id="lJoin">Připojit ➜</button></div>
  <p id="lErr" style="margin-top:10px;font-size:13px"></p>
 </div>
</div>

<div id="menubar" class="hidden">
 <span class="mchip" id="wolfBtn" style="font-size:16px">🐺</span>
 <b id="mApp">Finder</b>
 <span class="mchip hm" id="mOpen">Appky</span>
 <span class="sp"></span>
 <span class="mchip" id="mSpot" title="Spotlight (Ctrl+mezerník)">🔍</span>
 <span class="mchip" id="mRoom">👥</span>
 <span class="mchip hm" id="mWx"></span>
 <span id="mClock"></span>
</div>
<div id="wolfMenu" class="hidden">
 <div data-m="about">🐺 O WolfOS</div>
 <div data-m="invite">🔗 Pozvat kámoše</div>
 <div data-m="settings">⚙️ Nastavení…</div>
 <hr>
 <div data-m="tidy">🪟 Zavřít všechna okna</div>
 <div data-m="logout">🚪 Odhlásit se</div>
</div>
<div id="desk"><div id="icons" class="hidden"></div></div>
<div id="ctx" class="hidden"></div>
<div id="spot" class="hidden"><div class="sbx"><div class="sin">🔍<input id="spIn" placeholder="Hledat ve WolfOS…" autocomplete="off" spellcheck="false"></div><div class="sres" id="spRes"></div></div></div>
<div id="dock" class="hidden"></div>
<div id="curs"></div>
<div id="notifs"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getDatabase, ref, set, push, remove, update, onValue, onChildAdded, onChildRemoved, onChildChanged, onDisconnect, get, serverTimestamp, runTransaction, query, limitToLast } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

const fbApp = initializeApp({
  apiKey: "AIzaSyBovG00qfDWUBcS9pJlS_FwOH4etF9Sv0Y",
  authDomain: "flex-bubble.firebaseapp.com",
  databaseURL: "https://flex-bubble-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "flex-bubble",
  storageBucket: "flex-bubble.firebasestorage.app",
  messagingSenderId: "171220277752",
  appId: "1:171220277752:web:d5d68647bf1759db58de0d"
});
const auth = getAuth(fbApp), db = getDatabase(fbApp);
const ROOT = 'wolfos/rooms';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => Date.now();
const isMobile = () => innerWidth < 700;

/* ================= stav ================= */
let me = { name: '', emoji: '🐺', color: '#7b5cff', wall: 0, dark: false };
try { Object.assign(me, JSON.parse(localStorage.getItem('wo_me') || '{}')); } catch (e) { }
const saveMe = () => { try { localStorage.setItem('wo_me', JSON.stringify(me)); } catch (e) { } };
let uid = null, room = null, joinT = 0, users = {}, unsub = [];
const COLORS = ['#7b5cff', '#ff3b6b', '#ff9f0a', '#34c759', '#2f80ff', '#af52de', '#00c7be', '#ff2d55'];
if (!me.color || !COLORS.includes(me.color)) me.color = COLORS[Math.floor(Math.random() * COLORS.length)];
const WALLS = [
  'linear-gradient(135deg,#6a5cff,#ff6fb5 55%,#ffb86b)',
  'linear-gradient(160deg,#0f2027,#203a43 50%,#2c5364)',
  'radial-gradient(circle at 30% 20%,#ffd86b,#ff6b6b 45%,#5f2c82)',
  'linear-gradient(135deg,#43e97b,#38f9d7)',
  'linear-gradient(200deg,#1a1a2e,#16213e 40%,#e94560)',
  'radial-gradient(circle at 70% 80%,#00c6fb,#005bea 50%,#1b1464)',
  'linear-gradient(120deg,#f6d365,#fda085)',
  'linear-gradient(135deg,#232526,#414345)',
  'conic-gradient(from 200deg at 50% 60%,#ff6fb5,#7b5cff,#00c6fb,#43e97b,#ffd86b,#ff6fb5)'
];
function applyLook() {
  document.getElementById('wall').style.setProperty('--wall', WALLS[me.wall] || WALLS[0]);
  document.body.classList.toggle('dark', !!me.dark);
  document.documentElement.style.setProperty('--acc', me.color);
}
applyLook();

/* ================= login ================= */
const EMOJIS = ['🐺', '🦊', '🐱', '🐶', '🐼', '🦁', '🐸', '🐵', '🤖', '👾', '😎', '🦄', '🐉', '👻', '🐧', '🦈'];
$('#lEmo').innerHTML = EMOJIS.map(e => `<button data-e="${e}">${e}</button>`).join('');
function paintLogin() { $('#lAva').textContent = me.emoji; document.querySelectorAll('#lEmo button').forEach(b => b.classList.toggle('on', b.dataset.e === me.emoji)); }
$('#lEmo').onclick = e => { const b = e.target.closest('button'); if (!b) return; me.emoji = b.dataset.e; paintLogin(); };
$('#lName').value = me.name || '';
const hashCode = location.hash.replace('#', '').toUpperCase().slice(0, 5);
if (hashCode) $('#lCode').value = hashCode;
paintLogin();
const genCode = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random() * 24)]).join('');
function startLogin(code) {
  const n = $('#lName').value.trim(); if (!n) { $('#lErr').textContent = 'Napiš svoje jméno 🙂'; $('#lName').focus(); return; }
  me.name = n.slice(0, 16); saveMe();
  if (!uid) { $('#lErr').textContent = 'Připojuju se k serveru… ⏳'; setTimeout(() => startLogin(code), 700); return; }
  enterRoom(code);
}
$('#lNew').onclick = () => startLogin(genCode());
$('#lJoin').onclick = () => { const c = $('#lCode').value.trim().toUpperCase(); if (c.length < 3) { $('#lErr').textContent = 'Zadej kód plochy 🔑'; return; } startLogin(c); };
$('#lCode').onkeydown = e => { if (e.key === 'Enter') $('#lJoin').click(); };
$('#lName').onkeydown = e => { if (e.key === 'Enter') ($('#lCode').value ? $('#lJoin') : $('#lNew')).click(); };

let authFail = false;
onAuthStateChanged(auth, u => { if (u) { uid = u.uid; $('#lErr').textContent = ''; } });
signInAnonymously(auth).catch(err => { authFail = true; $('#lErr').textContent = 'Server nejde 😕 (' + err.code + ')'; });

/* ================= místnost ================= */
const R = p => ref(db, `${ROOT}/${room}/${p}`);
function enterRoom(code) {
  room = code; joinT = now(); location.hash = code;
  $('#login').classList.add('hidden'); ['#menubar', '#dock'].forEach(s => $(s).classList.remove('hidden'));
  const meRef = R(`users/${uid}`);

/* ---- Piškvorky ---- */
const N = 15;
function fiveWin(cells, r, c, s) {
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const line = [[r, c]];
    for (const sg of [1, -1]) { let rr = r + dr * sg, cc = c + dc * sg; while (cells[`${rr}_${cc}`] === s) { line.push([rr, cc]); rr += dr * sg; cc += dc * sg; } }
    if (line.length >= 5) return line.map(([a, b]) => `${a}_${b}`);
  }
  return null;
}

    const turn = G.turn || 'X';

  };

  b.querySelector('#tB').onclick = e => {

  const col = () => er ? '#fff' : b.querySelector('#wC').value, sz = () => +b.querySelector('#wS').value * (er ? 3 : 1);
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); down = pt(e); buf = [down]; };
  cv.onpointermove = e => { if (!down) return; const q = pt(e); seg(down, q, col(), sz()); down = q; buf.push(q); if (buf.length > 40) { const l = q; flush(); buf = [l]; } };
  cv.onpointerup = cv.onpointercancel = () => { down = null; flush(); buf = []; };
  b.querySelector('#wE').onclick = ev => { er = !er; ev.target.textContent = er ? '✏️ Tužka' : '🧽 Guma'; };
  b.querySelector('#wX').onclick = () => remove(R('wb'));
  const drawS = v => { if (v.u === uid) return; const pts = String(v.p).split(';').map(x => x.split(',').map(Number)); for (let i = 1; i < pts.length; i++) seg(pts[i - 1], pts[i], v.e ? '#fff' : v.c, v.z); };

} };

const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'H'];
const KEYS = 'awsedftgzhujkolpřů';
function playNote(midi, inst = 'triangle') {
  try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const f = 440 * Math.pow(2, (midi - 69) / 12), t = actx.currentTime;
  [1, 2].forEach((m, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = i ? 'sine' : inst; o.frequency.value = f * m; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(i ? .05 : .22, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 1.1); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 1.2); });
}

  const hit = (m, col) => { const k = b.querySelector(`[data-m="${m}"]`); if (!k) return; k.style.setProperty('--hc', col); k.classList.add('hit'); setTimeout(() => k.classList.remove('hit'), 220); };
  const press = m => { const inst = b.querySelector('#pI').value; playNote(m, inst); hit(m, me.color); push(R('piano'), { m, u: uid, c: me.color, e: me.emoji, n: me.name, i: inst, at: now() }); };

APPS.calc = { n: 'Kalkulačka', i: '🧮', bg: 'linear-gradient(135deg,#ffb347,#ff9f0a)', w: 300, h: 460, open(b) {
  const keys = [['C', 'f'], ['±', 'f'], ['%', 'f'], ['÷', 'o'], ['7'], ['8'], ['9'], ['×', 'o'], ['4'], ['5'], ['6'], ['−', 'o'], ['1'], ['2'], ['3'], ['+', 'o'], ['0', 'z'], [','], ['=', 'o']];
  b.innerHTML = `<div class="calc"><div class="scr">0</div>${keys.map(([k, c]) => `<button class="${c || ''}">${k}</button>`).join('')}</div>`;
  const scr = b.querySelector('.scr'); let cur = '0', acc = null, op = null, fresh = false;
  const show = () => scr.textContent = cur.replace('.', ',');
  const calc = (a, b, o) => o === '+' ? a + b : o === '−' ? a - b : o === '×' ? a * b : o === '÷' ? (b === 0 ? NaN : a / b) : b;
  b.querySelector('.calc').onclick = e => {
    const k = e.target.tagName === 'BUTTON' ? e.target.textContent : null; if (!k) return;
    if (/\d/.test(k)) { cur = (fresh || cur === '0') ? k : cur + k; fresh = false; }
    else if (k === ',') { if (fresh) { cur = '0'; fresh = false; } if (!cur.includes('.')) cur += '.'; }
    else if (k === 'C') { cur = '0'; acc = null; op = null; }
    else if (k === '±') cur = String(-parseFloat(cur));
    else if (k === '%') cur = String(parseFloat(cur) / 100);
    else if (k === '=') { if (op) { cur = String(+calc(acc, parseFloat(cur), op).toPrecision(12)); op = null; acc = null; fresh = true; } }
    else { if (op && !fresh) cur = String(+calc(acc, parseFloat(cur), op).toPrecision(12)); acc = parseFloat(cur); op = k; fresh = true; }
    if (cur === 'NaN') cur = 'Chyba 🙃'; show(); if (cur.startsWith('Chyba')) cur = '0';
  };
} };

const hideCtx = () => $('#ctx').classList.add('hidden');
$('#ctx').onclick = e => { const i = e.target.dataset.i; if (i === undefined) return; hideCtx(); CTX[+i][1](); };
const onDesk = t => room && t.closest && t.closest('#desk') && !t.closest('.win');
document.addEventListener('contextmenu', e => { if (!onDesk(e.target)) return; e.preventDefault(); showCtx(e.clientX, e.clientY); });
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#ctx')) hideCtx();
  if (onDesk(e.target) && !e.target.closest('.dico')) $('#icons').querySelectorAll('.dico').forEach(x => x.classList.remove('sel'));
});
// dlouhé podržení na mobilu = pravé tlačítko
let lpT = null;
document.addEventListener('touchstart', e => {
  if (!onDesk(e.target) || e.touches.length > 1) return; const t = e.touches[0];
  clearTimeout(lpT); lpT = setTimeout(() => showCtx(t.clientX, t.clientY), 550);
}, { passive: true });
['touchend', 'touchmove', 'touchcancel'].forEach(ev => document.addEventListener(ev, () => clearTimeout(lpT), { passive: true }));

/* ================= Spotlight ================= */
const KW = { flex: 'bubliny sit kamosi', chat: 'zpravy psat povidat', ttt: 'piskvorky hra tictactoe', wb: 'tabule whiteboard kresleni sdilena', rps: 'kamen nuzky papir hra souboj', piano: 'klavir hudba noty', notes: 'nalepky poznamky papirky', art: 'kresleni malovani artparty', term: 'terminal prikazy konzole', weather: 'pocasi teplota ostrava', calc: 'kalkulacka pocitani matika', people: 'lidi online kamosi', settings: 'nastaveni tapeta barva', welcome: 'vitej napoveda', launch: 'appky launchpad vsechno' };
const ACTIONS = [
  { i: '📝', n: 'Nová nálepka', k: 'nalepka nova', f: newSticker },
  { i: '🖼️', n: 'Změnit tapetu', k: 'tapeta pozadi', f: nextWall },
  { i: '🌙', n: 'Tmavý režim', k: 'tmavy svetly rezim dark', f: () => { me.dark = !me.dark; saveMe(); applyLook(); } },
  { i: '🔗', n: 'Pozvat kámoše', k: 'pozvat odkaz sdilet', f: () => invite() },
  { i: '🪟', n: 'Zavřít všechna okna', k: 'zavrit okna', f: () => Object.keys(wins).forEach(closeWin) },
];
const fold = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
let spSel = 0, spList = [];
function spSearch() {
  const q = fold($('#spIn').value.trim());
  const apps = Object.keys(APPS).map(k => ({ i: APPS[k].i, n: APPS[k].n, bg: APPS[k].bg, k: k + ' ' + (KW[k] || ''), t: 'Appka', f: () => openApp(k) }));
  const acts = ACTIONS.map(a => ({ ...a, t: 'Akce' }));
  let res = [...apps, ...acts];
  if (q) res = res.map(r => { const n = fold(r.n), k = fold(r.k); const sc = n.startsWith(q) ? 3 : n.includes(q) ? 2 : k.includes(q) ? 1 : 0; return { ...r, sc }; }).filter(r => r.sc).sort((a, b) => b.sc - a.sc);
  else res = apps.filter(r => ICONS.some(k => APPS[k].n === r.n));
  const qRaw = $('#spIn').value.trim();
  if (/^[\d\s+\-*/().,×÷]+$/.test(qRaw) && /\d/.test(qRaw) && /[+\-*/×÷]/.test(qRaw)) {
    try { const v = Function('"use strict";return (' + qRaw.replace(/,/g, '.').replace(/×/g, '*').replace(/÷/g, '/') + ')')(); if (isFinite(v)) res.unshift({ i: '🧮', n: `= ${String(+v.toPrecision(12)).replace('.', ',')}`, t: 'Výpočet', f: () => openApp('calc') }); } catch (e) { }
  }
  if (qRaw && !res.length) res.push({ i: '💬', n: `Poslat do chatu: „${qRaw}“`, t: 'Chat', f: () => { sendChat(qRaw); openApp('chat'); } });
  spList = res.slice(0, 8); spSel = 0; spPaint();
}
function spPaint() {
  $('#spRes').innerHTML = spList.map((r, i) => `<div class="sr${i === spSel ? ' on' : ''}" data-i="${i}"><div class="ii" style="background:${r.bg || 'rgba(127,127,127,.18)'}">${r.i}</div>${esc(r.n)}<small>${r.t}</small></div>`).join('');
}
function openSpot() { if (!room) return; hideCtx(); $('#spot').classList.remove('hidden'); $('#spIn').value = ''; spSearch(); setTimeout(() => $('#spIn').focus(), 30); }
function closeSpot() { $('#spot').classList.add('hidden'); $('#spIn').blur(); }
function spGo(i) { const r = spList[i]; if (!r) return; closeSpot(); r.f(); }
$('#spIn').oninput = spSearch;
$('#spIn').onkeydown = e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); spSel = Math.min(spList.length - 1, spSel + 1); spPaint(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); spSel = Math.max(0, spSel - 1); spPaint(); }
  else if (e.key === 'Enter') { e.preventDefault(); spGo(spSel); }
  else if (e.key === 'Escape') closeSpot();
};
$('#spRes').onclick = e => { const d = e.target.closest('.sr'); if (d) spGo(+d.dataset.i); };
$('#spot').onclick = e => { if (e.target.id === 'spot') closeSpot(); };
$('#mSpot').onclick = e => { e.stopPropagation(); openSpot(); };
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.code === 'Space' || e.key === ' ' || e.key.toLowerCase() === 'k')) { e.preventDefault(); $('#spot').classList.contains('hidden') ? openSpot() : closeSpot(); }
  else if (e.key === 'Escape') { closeSpot(); hideCtx(); }
});

addEventListener('resize', renderCursors);
</script>
